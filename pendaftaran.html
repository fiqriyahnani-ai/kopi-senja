<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Website Kegiatan Mahasiswa</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Beranda</a></li>
            <li><a href="profil.html">Profil</a></li>
            <li><a href="pendaftaran.html">pendaftaran</a></li>
        </ul>
    </nav>
    <main>
        <section>
            <h2>Form Pendaftaran</h2>
            <form>
                <!--type text-->
                <label>Nama :</label>
                <input type="text" name="nama" placeholder="masukan nama anda" required /><br />


                <!--type email-->
                <label>Email :</label>
                <input type="email" name="email" placeholder="masukan email anda" required /><br />

                <!--password-->
                <label>Password :</label>
                <input type="password" name="password" placeholder="masukan password anda" required /><br />

                <!--date-->
                <label>Tanggal Lahir :</label>
                <input type="date" name="tanggal_lahir" required /><br />


                <!--time-->
                <label>Waktu Daftar :</label>
                <input type="time" name="daftar" /><br>

                <!--upload-->
                <label>Upload Profil :</label>
                <input type="file" name="upload" /><br />

                <!--number-->
                <label>Umur :</label>
                <input type="number" name="umur" min="1" max="100"/><br />

                <!--Radio button-->
                <label>Gender :</label>
                <input type="radio" name="gender" 
                value="laki-laki" />Laki-laki 
                <input type="radio" name="gender"
                value="perempuan" />Perempuan 
                <br />

                <!--select/dropdown-->
                <label>Program Studi :</label>
                <select name="program_studi">
                    <option value="">---Program Studi---</option>
                    <option value="sistem_informasi">Sistem Informasi</option>
                    <option value="sistem_komputer">Sistem Komputer</option>
                </select>
                <br />

                <!--chechbox-->
                <label>Minat :</label>
                <input type="checkbox" name="minat"
                value="ui/ux" />UI/UX <input type="checkbox" name="minat"
                value="data_analyst" />Data Analyst 
                <input type="checkbox" name="minat"
                value="product_ manager" />Product manager <br />

                <!--textarea-->
                <label>Alamat :</label>
                <textarea name="alamat" rows="4"
                cols="40" placeholder="masukan alamat anda"></textarea><br />

                <!--button-->
                <button type="submit">kirim Data</button>
                <button type="reset">Reset Data</button>

            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Website Kegiatan Mahasiswa</p>
    </footer>
</body>
</html>
